# Production stack. See README.md for the development override and environment variables.
services:
  frontend:
    image: ${REGISTRY:-ghcr.io/instituutnederlandsetaal/gretel}/gretel5-frontend:${VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
        BUILD_SOURCE_URL: ${BUILD_SOURCE_URL:-github:CentreForDigitalHumanities/gretel}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: ${REGISTRY:-ghcr.io/instituutnederlandsetaal/gretel}/gretel5-backend:${VERSION:-latest}
    build: &backend-build
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
    environment: &backend-environment
      REDIS_HOST: redis
      BASEX_HOST: basex
      ALPINO_HOST: alpino
      DATABASE_PATH: /app/backend/database/db.sqlite3
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-webmaster@localhost}
    volumes: &backend-volumes
      - gretel-database:/app/backend/database
      - gretel-uploads:/app/backend/uploaded_treebanks
      - gretel-results-cache:/app/backend/query_result_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      basex:
        condition: service_healthy
      alpino:
        condition: service_started
    restart: unless-stopped

  celery:
    image: ${REGISTRY:-ghcr.io/instituutnederlandsetaal/gretel}/gretel5-backend:${VERSION:-latest}
    build: *backend-build
    environment: *backend-environment
    volumes: *backend-volumes
    # Beat runs the periodic cache cleanup configured in gretel/celery.py.
    command: ["python", "-m", "celery", "-A", "gretel.celery", "worker", "-l", "info", "-B"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  alpino:
    image: registry.webhosting.rug.nl/compling/alpino:latest
    environment:
      PROLOGMAXSIZE: 1500M
    command: ["Alpino", "-notk", "-veryfast", "user_max=600000", "server_kind=parse", "server_port=7001", "assume_input_is_tokenized=on", "debug=0", "end_hook=xml", "-init_dict_p", "batch_command=alpino_server"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  basex:
    image: ${REGISTRY:-ghcr.io/instituutnederlandsetaal/gretel}/gretel5-basex:${VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.basex
    volumes:
      - gretel-basex:/data
    healthcheck:
      test: ["CMD", "/basex/bin/basexclient", "-Uadmin", "-Padmin", "-cEXIT"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  gretel-basex:
  gretel-database:
  gretel-uploads:
  gretel-results-cache:
