name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'release/**'
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.12.23'
          enable-cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unar
          uv sync --locked
      - name: Start BaseX
        run: |
          docker build -f docker/Dockerfile.basex -t gretel-basex-ci .
          docker run -d --name gretel-basex-ci -p 1984:1984 gretel-basex-ci
          for attempt in {1..30}; do
            if docker exec gretel-basex-ci /basex/bin/basexclient -Uadmin -Padmin -cEXIT; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Lint Python
        run: bash backend/lint.sh
      - name: Check migrations
        working-directory: backend
        run: uv run --locked python manage.py makemigrations --check --dry-run
      - name: Test backend
        run: |
          uv run --locked python manage.py test
          uv run --locked pytest test
        working-directory: backend
      - name: BaseX logs
        if: failure()
        run: docker logs gretel-basex-ci

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install dependencies
        run: npm --prefix web-ui ci
      - name: Build frontend
        run: npm run build
      - name: Test frontend
        run: npm run test-front

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build production images
        run: |
          BUILD_SHA="$GITHUB_SHA" BUILD_SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            docker compose -f docker/docker-compose.yml build
      - name: Build development images
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml build
